<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOOSTER X WIRE - Client Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
        body { background-color: #030712; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; position: relative; overflow-x: hidden; }
        
        #bg-video-element {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 0; pointer-events: none; opacity: 0.85;
        }
        .bg-video-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(3, 7, 18, 0.65); z-index: 1; pointer-events: none;
        }

        .app-container { width: 100%; max-width: 420px; padding: 20px; z-index: 10; position: relative; }
        .cyber-card { background: rgba(10, 16, 30, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 28px; padding: 26px 20px; box-shadow: 0 0 35px rgba(0, 229, 255, 0.3); position: relative; overflow: hidden; }
        
        .avatar-wrapper { width: 80px; height: 80px; margin: 0 auto 12px auto; border-radius: 50%; padding: 4px; background: linear-gradient(135deg, #00e5ff, #ff0055, #7928ca); box-shadow: 0 0 25px rgba(255, 0, 85, 0.7); }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #090d16; display: block; }
        
        .brand-title { text-align: center; font-size: 20px; font-weight: 800; letter-spacing: 1.5px; color: #ffffff; text-shadow: 0 0 12px rgba(0, 229, 255, 0.9); margin-bottom: 2px; }
        .brand-subtitle { text-align: center; font-size: 9px; color: #00e5ff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 18px; font-weight: 600; }
        
        .form-group-custom { margin-bottom: 10px; }
        label { display: block; font-size: 9px; color: #9ca3af; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; }
        
        .input-box-wrapper { position: relative; }
        .key-input { width: 100%; padding: 14px 45px 14px 14px; background: rgba(5, 10, 20, 0.95); border: 1px solid rgba(0, 229, 255, 0.5); border-radius: 12px; color: #00e5ff; font-size: 13px; font-weight: 600; letter-spacing: 1px; outline: none; }
        .key-input::placeholder { color: #4b5563; }
        .paste-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: rgba(0, 229, 255, 0.2); border: 1px solid rgba(0, 229, 255, 0.4); color: #00e5ff; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .status-text { text-align: center; font-size: 10px; color: #9ca3af; margin: 12px 0 16px 0; letter-spacing: 0.5px; }
        
        .slide-container { position: relative; width: 100%; height: 52px; background: rgba(4, 12, 24, 0.95); border: 1px solid rgba(0, 229, 255, 0.5); border-radius: 26px; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; touch-action: none; }
        .slide-text { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: rgba(255, 255, 255, 0.7); pointer-events: none; }
        .slide-handle { position: absolute; left: 4px; width: 44px; height: 44px; background: linear-gradient(135deg, #00e5ff, #0088ff); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #000; font-size: 15px; cursor: pointer; box-shadow: 0 0 15px rgba(0, 229, 255, 0.9); z-index: 10; touch-action: none; }
        
        .audio-toggle-btn { position: fixed; top: 15px; right: 15px; z-index: 100; background: rgba(10, 16, 30, 0.8); border: 1px solid rgba(0, 229, 255, 0.5); color: #00e5ff; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }

        .footer-tag { text-align: center; font-size: 9px; color: #6b7280; letter-spacing: 1px; text-transform: uppercase; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .dash-title { font-size: 14px; font-weight: 700; color: #ffffff; letter-spacing: 1px; }
        .badge-active { background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #10b981; padding: 3px 8px; border-radius: 6px; font-size: 9px; font-weight: 700; letter-spacing: 1px; }
        
        .timer-dial-wrapper { position: relative; width: 160px; height: 160px; margin: 2px auto 12px auto; display: flex; align-items: center; justify-content: center; }
        .dial-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .dial-bg { fill: none; stroke: rgba(255, 255, 255, 0.08); stroke-width: 6; }
        .dial-progress { fill: none; stroke: url(#cyan-gradient); stroke-width: 6; stroke-linecap: round; stroke-dasharray: 502; stroke-dashoffset: 100; transition: stroke-dashoffset 1s linear; }
        .dial-center-content { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .timer-display { font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #ffffff; text-shadow: 0 0 10px rgba(0, 229, 255, 0.6); }
        .timer-labels { display: flex; gap: 5px; font-size: 6px; color: #9ca3af; letter-spacing: 1px; margin-top: 2px; }
        .bound-subtitle { font-size: 8px; color: #00e5ff; letter-spacing: 1px; margin-top: 3px; font-weight: 600; }
        
        .info-card-box { background: rgba(5, 12, 25, 0.8); border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .info-label { font-size: 8px; color: #6b7280; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
        .info-val-key { font-size: 11px; font-weight: 700; color: #00e5ff; letter-spacing: 1px; }
        .copy-chip { background: rgba(0, 229, 255, 0.2); border: 1px solid rgba(0, 229, 255, 0.4); color: #00e5ff; padding: 4px 10px; border-radius: 6px; font-size: 9px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        
        .details-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
        .grid-item { background: rgba(5, 12, 25, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 6px; text-align: center; }
        .grid-val { font-size: 9px; font-weight: 700; color: #ffffff; }
        
        .app-btn-stack { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
        .btn-action { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: 800; font-size: 12px; letter-spacing: 1.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase; text-decoration: none; }
        .btn-v2box { background: linear-gradient(135deg, #00e5ff, #0088ff); color: #000000; box-shadow: 0 0 20px rgba(0, 229, 255, 0.6); }
        .btn-logout { background: transparent; border: none; color: #ef4444; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; margin: 0 auto; display: block; cursor: pointer; padding: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <video id="bg-video-element" autoplay loop playsinline>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-with-code-31930-large.mp4" type="video/mp4">
    </video>
    <div class="bg-video-overlay"></div>

    <button class="audio-toggle-btn" id="audio-toggle-btn" title="Toggle Sound">
        <i class="fa-solid fa-volume-xmark" id="audio-icon"></i>
    </button>

    <div class="app-container">
        <!-- LOGIN SCREEN -->
        <div id="screen-login" class="cyber-card">
            <div class="avatar-wrapper">
                <img id="avatar-img-login" src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=300&auto=format&fit=crop" alt="Logo" class="avatar-img">
            </div>
            <h1 class="brand-title">BOOSTER X WIRE</h1>
            <p class="brand-subtitle">✦ SECURE KEY PORTAL ✦</p>
            
            <div class="form-group-custom">
                <label>Enter Admin Key</label>
                <div class="input-box-wrapper">
                    <input type="text" id="input-key" class="key-input" placeholder="BX-VIP-XXXX" autocomplete="off">
                    <button class="paste-btn" id="btn-paste-key"><i class="fa-solid fa-paste"></i></button>
                </div>
            </div>

            <p class="status-text" id="login-status-msg">STATUS: READY FOR VERIFICATION</p>
            
            <div class="slide-container" id="slide-box">
                <span class="slide-text">SLIDE TO LOGIN &gt;&gt;&gt;</span>
                <div class="slide-handle" id="slide-handle"><i class="fa-solid fa-arrow-right"></i></div>
            </div>
            <p class="footer-tag">STRICT DEVICE-LOCKED SYSTEM</p>
        </div>

        <!-- DASHBOARD SCREEN -->
        <div id="screen-dashboard" class="cyber-card hidden">
            <div style="display: flex; justify-content: center; margin-bottom: 10px;">
                <div style="width: 45px; height: 45px; border-radius: 50%; padding: 2px; background: linear-gradient(135deg, #00e5ff, #7928ca); box-shadow: 0 0 12px rgba(0, 229, 255, 0.5);">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=300&auto=format&fit=crop" alt="Avatar" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #090d16; display: block;">
                </div>
            </div>

            <div class="dashboard-header">
                <span class="dash-title">BOOSTER X WIRE</span>
                <span class="badge-active">ACTIVE</span>
            </div>
            <div class="timer-dial-wrapper">
                <svg class="dial-svg" viewBox="0 0 200 200">
                    <defs>
                        <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00e5ff" />
                            <stop offset="100%" stop-color="#7928ca" />
                        </linearGradient>
                    </defs>
                    <circle class="dial-bg" cx="100" cy="100" r="80" />
                    <circle id="dial-progress-bar" class="dial-progress" cx="100" cy="100" r="80" />
                </svg>
                <div class="dial-center-content">
                    <div id="timer-text" class="timer-display">00:00:00:00</div>
                    <div class="timer-labels"><span>DAYS</span><span>HRS</span><span>MIN</span><span>SEC</span></div>
                    <p class="bound-subtitle">LOCKED TO DEVICE</p>
                </div>
            </div>
            <div class="info-card-box">
                <div>
                    <div class="info-label">ACTIVE KEY</div>
                    <div id="disp-active-key" class="info-val-key" style="max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">BX-XXXX</div>
                </div>
                <button class="copy-chip" id="btn-copy-key"><i class="fa-regular fa-copy"></i> COPY</button>
            </div>
            <div class="details-grid">
                <div class="grid-item"><div class="info-label">ACTIVATED</div><div id="disp-act" class="grid-val">--</div></div>
                <div class="grid-item"><div class="info-label">EXPIRES</div><div id="disp-exp" class="grid-val">--</div></div>
                <div class="grid-item"><div class="info-label">DEVICE ID</div><div class="grid-val" id="disp-device-id" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">BOOSTER X WIRE</div></div>
            </div>
            <div class="app-btn-stack">
                <a id="btn-import-v2box" href="#" class="btn-action btn-v2box"><i class="fa-solid fa-bolt"></i> ADD TO V2BOX</a>
            </div>
            <button class="btn-logout" id="btn-logout">LOG OUT</button>
        </div>
    </div>

    <script>
        const STORAGE_KEYS = "BX_KEYS_DB";
        const STORAGE_ACTIVE = "BX_CURRENT_ACTIVE_SESSION";
        const STORAGE_CONFIG = "BX_DIRECT_CONFIG";
        const STORAGE_MAINTENANCE = "BX_GLOBAL_MAINTENANCE";

        const DEFAULT_KEYS = [
            { key: "BX-VIP-KTX8ZT" },
            { key: "BX-VIP-TESTKEY" }
        ];

        window.addEventListener('load', () => {
            // Live Maintenance Check
            let maintMode = localStorage.getItem(STORAGE_MAINTENANCE) || "OFF";
            if (maintMode === "ON") {
                document.body.innerHTML = `
                    <div style="background:#030712; color:#00e5ff; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; font-family:sans-serif;">
                        <i class="fa-solid fa-screwdriver-wrench" style="font-size:48px; margin-bottom:20px; color:#ef4444;"></i>
                        <h1 style="font-size:20px; letter-spacing:2px; margin-bottom:10px;">SITE UNDER MAINTENANCE</h1>
                        <p style="color:#9ca3af; font-size:12px;">We are upgrading our servers. Please check back soon!</p>
                    </div>
                `;
                return;
            }

            if (!localStorage.getItem(STORAGE_KEYS)) {
                localStorage.setItem(STORAGE_KEYS, JSON.stringify(DEFAULT_KEYS));
            }

            const act = JSON.parse(localStorage.getItem(STORAGE_ACTIVE));
            if(act && act.key) {
                if(Date.now() > act.expiresAt) {
                    localStorage.removeItem(STORAGE_ACTIVE);
                } else {
                    showDashboard(act);
                }
            }
        });

        // Audio Unmute Handler
        const videoElem = document.getElementById('bg-video-element');
        const audioBtn = document.getElementById('audio-toggle-btn');
        const audioIcon = document.getElementById('audio-icon');

        videoElem.muted = true;
        audioBtn.addEventListener('click', () => {
            if (videoElem.muted) {
                videoElem.muted = false;
                videoElem.play();
                audioIcon.className = "fa-solid fa-volume-high";
                audioBtn.style.boxShadow = "0 0 25px #00e5ff";
            } else {
                videoElem.muted = true;
                audioIcon.className = "fa-solid fa-volume-xmark";
                audioBtn.style.boxShadow = "0 0 15px rgba(0, 229, 255, 0.4)";
            }
        });

        async function verifyKey() {
            let keyVal = document.getElementById('input-key').value.trim();
            const status = document.getElementById('login-status-msg');
            
            if(!keyVal) {
                status.innerText = "PLEASE ENTER AN ADMIN KEY";
                status.style.color = "#ef4444";
                resetSlide();
                return;
            }

            status.innerText = "VERIFYING KEY...";
            status.style.color = "#00e5ff";

            let db = JSON.parse(localStorage.getItem(STORAGE_KEYS)) || DEFAULT_KEYS;
            let foundKey = db.find(k => k.key === keyVal);

            if (!foundKey) {
                status.innerText = "INVALID KEY (NOT IN ADMIN DB)";
                status.style.color = "#ef4444";
                resetSlide();
                return;
            }

            const now = Date.now();
            const sessionExpiry = now + (24 * 60 * 60 * 1000); // 24 Hours

            const DEFAULT_PAYLOAD = "hy2://XREG-49B5-A1F0-B53A.1793843700.18f9a12063d00b18ef54234d3648d914@wraith-bom3.xreg.site:443?security=tls&insecure=1&alpn=http/1.1&sni=wraith-bom3.xreg.site#BOOSTER X WIRE";
            let payloadUrl = localStorage.getItem(STORAGE_CONFIG) || DEFAULT_PAYLOAD;

            let sessionData = {
                key: foundKey.key,
                payload: payloadUrl,
                activatedTime: now,
                expiresAt: sessionExpiry,
                deviceId: "BOOSTER X WIRE"
            };
            
            localStorage.setItem(STORAGE_ACTIVE, JSON.stringify(sessionData));
            showDashboard(sessionData);
        }

        const handle = document.getElementById('slide-handle');
        const box = document.getElementById('slide-box');
        let dragging = false, startX = 0, maxS = 0;
        function updateMax() { maxS = box.clientWidth - handle.clientWidth - 8; }
        window.addEventListener('resize', updateMax);
        updateMax();

        handle.addEventListener('pointerdown', e => {
            dragging = true; startX = e.clientX;
            handle.setPointerCapture(e.pointerId);
            handle.style.transition = 'none';
        });
        handle.addEventListener('pointermove', e => {
            if (!dragging) return;
            let d = e.clientX - startX;
            if (d < 0) d = 0; if (d > maxS) d = maxS;
            handle.style.left = (d + 4) + 'px';
            if (d >= maxS - 4) { dragging = false; handle.style.left = (maxS + 4) + 'px'; verifyKey(); }
        });
        handle.addEventListener('pointerup', () => { if (dragging) { dragging = false; resetSlide(); } });
        handle.addEventListener('pointercancel', () => { if (dragging) { dragging = false; resetSlide(); } });
        function resetSlide() { handle.style.transition = 'left 0.3s ease'; handle.style.left = '4px'; }

        let timerObj = null;
        function showDashboard(k) {
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-dashboard').classList.remove('hidden');
            document.getElementById('disp-active-key').innerText = k.key;
            document.getElementById('disp-device-id').innerText = k.deviceId;

            const act = new Date(k.activatedTime);
            const exp = new Date(k.expiresAt);
            document.getElementById('disp-act').innerText = act.getDate() + "/" + (act.getMonth()+1);
            document.getElementById('disp-exp').innerText = exp.getDate() + "/" + (exp.getMonth()+1);

            const totalDuration = k.expiresAt - k.activatedTime;
            const bar = document.getElementById('dial-progress-bar');
            const circ = 2 * Math.PI * 80;

            document.getElementById('btn-import-v2box').onclick = function(e) {
                e.preventDefault();
                window.location.href = "v2box://install-config?url=" + encodeURIComponent(k.payload);
            };

            if(timerObj) clearInterval(timerObj);
            timerObj = setInterval(() => {
                const rem = k.expiresAt - Date.now();
                if(rem <= 0) { clearInterval(timerObj); alert("Key time expired!"); logout(); return; }
                const d = Math.floor(rem / 86400000);
                const h = Math.floor((rem % 86400000) / 3600000);
                const m = Math.floor((rem % 3600000) / 60000);
                const s = Math.floor((rem % 60000) / 1000);
                document.getElementById('timer-text').innerText = String(d).padStart(2,'0') + ':' + String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
                bar.style.strokeDashoffset = circ * (1 - (rem / totalDuration));
            }, 1000);
        }

        function logout() {
            localStorage.removeItem(STORAGE_ACTIVE);
            if(timerObj) clearInterval(timerObj);
            document.getElementById('screen-dashboard').classList.add('hidden');
            document.getElementById('screen-login').classList.remove('hidden');
            document.getElementById('input-key').value = '';
            document.getElementById('login-status-msg').innerText = "STATUS: READY FOR VERIFICATION";
            resetSlide();
        }

        document.getElementById('btn-logout').addEventListener('click', logout);
        
        document.getElementById('btn-paste-key').addEventListener('click', async () => {
            try { const t = await navigator.clipboard.readText(); document.getElementById('input-key').value = t; } catch(e) { alert("Please paste manually."); }
        });

        document.getElementById('btn-copy-key').addEventListener('click', () => {
            const keyText = document.getElementById('disp-active-key').innerText;
            navigator.clipboard.writeText(keyText).then(() => {
                let btn = document.getElementById('btn-copy-key');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> COPIED!';
                setTimeout(() => { btn.innerHTML = '<i class="fa-regular fa-copy"></i> COPY'; }, 2000);
            });
        });
    </script>
</body>
</html>
