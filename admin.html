<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOSTER X WIRE - Admin Key & Config Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #030712; color: #fff; min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
        .admin-container { width: 100%; max-width: 500px; margin-top: 10px; }
        .card { background: rgba(10, 16, 30, 0.95); border: 1px solid rgba(0, 229, 255, 0.4); border-radius: 20px; padding: 20px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.2); margin-bottom: 20px; }
        h1 { font-size: 16px; color: #00e5ff; margin-bottom: 14px; text-align: center; letter-spacing: 1px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 10px; color: #9ca3af; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        input, select, textarea { width: 100%; padding: 12px; background: #050a14; border: 1px solid rgba(0, 229, 255, 0.3); border-radius: 10px; color: #fff; font-size: 12px; outline: none; }
        textarea { height: 90px; resize: none; font-size: 11px; }
        .duration-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #00e5ff, #0088ff); border: none; border-radius: 12px; color: #000; font-weight: 800; font-size: 12px; letter-spacing: 1px; cursor: pointer; text-transform: uppercase; box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }
        .key-list { margin-top: 12px; max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .key-item { background: rgba(5, 12, 25, 0.9); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .key-text { color: #00e5ff; font-weight: 700; letter-spacing: 1px; }
        .btn-group-actions { display: flex; gap: 6px; align-items: center; }
        .copy-btn { background: rgba(0, 229, 255, 0.2); border: 1px solid rgba(0, 229, 255, 0.4); color: #00e5ff; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 9px; font-weight: 700; }
        .del-btn { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 9px; font-weight: 700; }
        .success-msg { text-align: center; font-size: 10px; color: #10b981; margin-top: 8px; display: none; }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- MAINTENANCE MODE -->
        <div class="card">
            <h1><i class="fa-solid fa-screwdriver-wrench"></i> MAINTENANCE MODE</h1>
            <div class="form-group">
                <label>Site Status Switch</label>
                <select id="maintenance-toggle">
                    <option value="OFF">OFF (Normal Operational)</option>
                    <option value="ON">ON (Maintenance Locked)</option>
                </select>
            </div>
            <button class="btn" id="btn-save-maintenance">Save Status</button>
            <div class="success-msg" id="maint-success">Status updated successfully!</div>
        </div>

        <!-- CONFIG PAYLOAD -->
        <div class="card">
            <h1><i class="fa-solid fa-sliders"></i> V2BOX CONFIG PAYLOAD</h1>
            <div class="form-group">
                <label>Update Client Config / Payload URL</label>
                <textarea id="input-config-url" placeholder="Paste v2ray/hysteria2 URL here..."></textarea>
            </div>
            <button class="btn" id="btn-save-config">Save Payload URL</button>
            <div class="success-msg" id="config-success">Payload updated successfully!</div>
        </div>

        <!-- KEY GENERATOR -->
        <div class="card">
            <h1><i class="fa-solid fa-shield-halved"></i> ADVANCED KEY GENERATOR</h1>
            <div class="form-group">
                <label>Custom Key Prefix</label>
                <input type="text" id="key-prefix" value="BX-VIP-">
            </div>
            <div class="form-group">
                <label>Validity Duration</label>
                <div class="duration-grid">
                    <input type="number" id="duration-value" value="24" min="1">
                    <select id="duration-unit">
                        <option value="minutes">Minutes</option>
                        <option value="hours" selected>Hours</option>
                        <option value="days">Days</option>
                        <option value="months">Months</option>
                    </select>
                </div>
            </div>
            <button class="btn" id="btn-generate">Generate Secure Key</button>
        </div>

        <!-- ACTIVE KEYS DATABASE -->
        <div class="card">
            <h1>Active Database Keys</h1>
            <div class="key-list" id="key-list-container"></div>
        </div>
    </div>

    <script>
        // GLOBAL HARDCODED KEYS (Yahan aapki keys fix hain jo sabhi ke liye chalengi)
        let GLOBAL_KEYS_DB = [
            { key: "BX-VIP-KTX8ZT", durationVal: 24, durationUnit: "hours" },
            { key: "BX-VIP-TESTKEY", durationVal: 24, durationUnit: "hours" }
        ];

        const STORAGE_CONFIG = "BX_DIRECT_CONFIG";
        const DEFAULT_CONFIG = "hy2://XREG-49B5-A1F0-B53A.1793843700.18f9a12063d00b18ef54234d3648d914@wraith-bom3.xreg.site:443?security=tls&insecure=1&alpn=http/1.1&sni=wraith-bom3.xreg.site#BOOSTER X WIRE";

        window.addEventListener('load', () => {
            let current = localStorage.getItem(STORAGE_CONFIG) || DEFAULT_CONFIG;
            document.getElementById('input-config-url').value = current;
            
            let savedMaint = localStorage.getItem("BX_GLOBAL_MAINTENANCE") || "OFF";
            document.getElementById('maintenance-toggle').value = savedMaint;

            let savedKeys = JSON.parse(localStorage.getItem("BX_GLOBAL_KEYS"));
            if(savedKeys) GLOBAL_KEYS_DB = savedKeys;
            
            loadKeys();
        });

        document.getElementById('btn-save-maintenance').addEventListener('click', () => {
            let val = document.getElementById('maintenance-toggle').value;
            localStorage.setItem("BX_GLOBAL_MAINTENANCE", val);
            alert("Maintenance status saved! (Note: To make it global for all users, update the 'IS_MAINTENANCE_ON' variable in index.html as well).");
            let msg = document.getElementById('maint-success');
            msg.style.display = "block";
            setTimeout(() => { msg.style.display = "none"; }, 2000);
        });

        document.getElementById('btn-save-config').addEventListener('click', () => {
            let val = document.getElementById('input-config-url').value.trim();
            if(!val) { alert("Please enter a valid URL!"); return; }
            localStorage.setItem(STORAGE_CONFIG, val);
            let msg = document.getElementById('config-success');
            msg.style.display = "block";
            setTimeout(() => { msg.style.display = "none"; }, 2000);
        });

        function loadKeys() {
            const container = document.getElementById('key-list-container');
            container.innerHTML = '';
            
            GLOBAL_KEYS_DB.forEach((item, index) => {
                let div = document.createElement('div');
                div.className = 'key-item';
                div.innerHTML = `
                    <div>
                        <div class="key-text">${item.key}</div>
                        <div style="font-size:9px; color:#9ca3af; margin-top:2px;">Target: BOOSTER X WIRE</div>
                    </div>
                    <div class="btn-group-actions">
                        <button class="copy-btn" onclick="copyKeyText('${item.key}', this)">COPY</button>
                        <button class="del-btn" onclick="deleteKey(${index})">DELETE</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.copyKeyText = function(keyStr, btnElem) {
            navigator.clipboard.writeText(keyStr).then(() => {
                let old = btnElem.innerHTML;
                btnElem.innerHTML = "COPIED";
                setTimeout(() => { btnElem.innerHTML = old; }, 1500);
            });
        };

        document.getElementById('btn-generate').addEventListener('click', () => {
            let prefix = document.getElementById('key-prefix').value.trim() || "BX-";
            let randomSuffix = Math.random().toString(36).substring(2, 8).toUpperCase();
            let newKeyStr = prefix + randomSuffix;

            GLOBAL_KEYS_DB.push({
                key: newKeyStr,
                durationVal: 24,
                durationUnit: "hours"
            });

            localStorage.setItem("BX_GLOBAL_KEYS", JSON.stringify(GLOBAL_KEYS_DB));
            loadKeys();
            
            // Ye code copy karne ke liye alert dega jise aap index.html mein bhi dal sakte hain
            prompt("Key generated successfully! Copy this key and ensure it's in index.html:", newKeyStr);
        });

        window.deleteKey = function(index) {
            GLOBAL_KEYS_DB.splice(index, 1);
            localStorage.setItem("BX_GLOBAL_KEYS", JSON.stringify(GLOBAL_KEYS_DB));
            loadKeys();
        };
    </script>
</body>
</html>
